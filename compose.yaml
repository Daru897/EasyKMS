services:
  easykms:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_DEMO_WORKSPACES: ${MAX_DEMO_WORKSPACES:-1000}
    volumes:
      - easykms-data:/app/data
    restart: unless-stopped
    mem_limit: 512m
volumes:
  easykms-data:
